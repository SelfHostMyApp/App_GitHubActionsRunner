# Docker Compose for Puppet Master Architecture
#
# This deploys:
# 1. The Puppet Master container (orchestrator)
# 2. Pre-builds the ephemeral runner image
#
# Usage:
#   1. Copy .env.example to .env and fill in your GitHub PAT
#   2. Copy config.json.example to config.json and configure repos/orgs
#   3. Run: docker-compose up -d (or: podman-compose up -d)
#
# The puppet master will:
# - Poll GitHub API every POLL_INTERVAL seconds
# - Spawn ephemeral runners (up to ceiling) when jobs are queued
# - Clean up runners after they complete their single job
#
# Compatible with both Docker and Podman

services:
  puppet-master:
    container_name: gh-puppet-master
    build:
      context: .
      dockerfile: Dockerfile.puppet-master
    restart: unless-stopped
    environment:
      - GITHUB_PAT=${GITHUB_PAT}
      - POLL_INTERVAL=${POLL_INTERVAL:-30}
      - RUNNER_IMAGE=${RUNNER_IMAGE:-gh-ephemeral-runner:latest}
      - CONTAINER_NETWORK=${CONTAINER_NETWORK:-github-runners}
    volumes:
      # Docker socket - uncomment ONE of these based on your runtime:
      # For Docker:
      - /var/run/docker.sock:/var/run/docker.sock
      # For Podman (rootful):
      # - /var/run/podman/podman.sock:/var/run/docker.sock
      # For Podman (rootless) - replace $UID with your user ID:
      # - /run/user/$UID/podman/podman.sock:/var/run/docker.sock

      # Mount the config file
      - ./config.json:/config/config.json:ro
    networks:
      - runner-network

  # Build the ephemeral runner image (doesn't run, just ensures image exists)
  ephemeral-runner-builder:
    container_name: gh-ephemeral-runner-builder
    build:
      context: .
      dockerfile: Dockerfile.ephemeral-runner
    image: gh-ephemeral-runner:latest
    # This service just builds the image, doesn't run
    entrypoint: ["echo", "Image built successfully"]
    profiles:
      - build

networks:
  runner-network:
    name: github-runners
    driver: bridge
